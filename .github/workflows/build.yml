name: Build DIEL firmware

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and build all DIEL variants
        run: bash tools/build.sh
      - name: Collect license notices and source references
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
        run: |
          cp -R LICENSE THIRD_PARTY.md licenses dist/
          printf 'DIEL source and build scripts: %s\n' "$SOURCE_URL" > dist/SOURCE.txt
          python3 tools/collect-notices.py .west-workspace dist/third-party
          cd dist && sha256sum ./*.uf2 > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diel-uf2
          path: dist/
          if-no-files-found: error
